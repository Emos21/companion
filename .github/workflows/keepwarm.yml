name: keep-warm

# Free-tier Render services sleep after ~15 minutes idle; the first request then
# pays a ~60s cold start. This pings them so a reviewer lands on a warm demo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend and frontend
        run: |
          curl -fsS --max-time 90 https://companion-api-d09g.onrender.com/health -o /dev/null || true
          curl -fsS --max-time 90 https://companion-web-k5ui.onrender.com/ -o /dev/null || true
