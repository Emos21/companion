services:
  - type: web
    name: companion-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: >-
      pip install -r requirements-local.txt &&
      python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='BAAI/bge-small-en-v1.5')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: MINIMAX_ANTHROPIC_BASE_URL
        value: https://api.minimax.io/anthropic
      - key: MINIMAX_MODEL
        value: MiniMax-M3
      - key: EMBEDDER
        value: auto
      - key: FRONTEND_ORIGIN
        value: https://companion-web-k5ui.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false

  - type: web
    name: companion-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://companion-api-d09g.onrender.com
